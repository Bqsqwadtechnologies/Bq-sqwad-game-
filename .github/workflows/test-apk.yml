name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  MODKIT_VERSION: 'v1.2'

jobs:
  build-test-apk:
    name: Build Android Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          echo "Building commit: $(git rev-parse HEAD)"
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/city_props.gd

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          java -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Download professional CC0 3D city assets
        run: |
          set -euo pipefail
          rm -rf /tmp/modkit assets/world/landly_city/modkit
          mkdir -p /tmp/modkit assets/world/landly_city/modkit
          wget -q --show-progress "https://github.com/JaronKBragg7337/asset-pack-ue-threejs-blender-unity/releases/download/${MODKIT_VERSION}/ModKit-v1.2.zip" -O /tmp/modkit.zip
          unzip -q /tmp/modkit.zip -d /tmp/modkit
          test -s /tmp/modkit/examples/industrial_outpost/ModKit_Industrial_Outpost.glb
          cp /tmp/modkit/examples/industrial_outpost/ModKit_Industrial_Outpost.glb assets/world/landly_city/modkit/ModKit_Industrial_Outpost.glb
          ls -lh assets/world/landly_city/modkit/ModKit_Industrial_Outpost.glb

      - name: Prepare uploaded audio for Godot
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          shopt -s nullglob
          converted=0
          for source in assets/audio/music/*.m4a; do
            base="${source%.m4a}"
            target="${base}.ogg"
            ffmpeg -hide_banner -loglevel error -y -i "$source" -vn -c:a libvorbis -q:a 5 "$target"
            converted=$((converted + 1))
          done
          echo "Converted $converted uploaded M4A music files to temporary Godot-compatible OGG assets."

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Validate project and Android export preset
        run: |
          set -euo pipefail
          test -s export_presets.cfg
          grep -q '^name="Android"$' export_presets.cfg
          grep -q '^platform="Android"$' export_presets.cfg
          test -s assets/world/landly_city/modkit/ModKit_Industrial_Outpost.glb
          mkdir -p build
          godot --headless --path . --editor --quit --verbose

      - name: Export test APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/BQ-Sqwad-Game-test.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s build/android/BQ-Sqwad-Game-test.apk
          file build/android/BQ-Sqwad-Game-test.apk
          unzip -l build/android/BQ-Sqwad-Game-test.apk | grep -q 'AndroidManifest.xml'

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: BQ-Sqwad-Game-test-apk
          path: build/android/BQ-Sqwad-Game-test.apk
          if-no-files-found: error
          retention-days: 14
