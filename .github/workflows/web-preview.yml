name: BQ Sqwad Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-preview:
    name: Build BQ Sqwad Web Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download Web export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Validate project
        run: |
          set -euo pipefail
          test -s project.godot
          test -s export_presets.cfg
          grep -q '^name="Web"$' export_presets.cfg
          grep -q '^platform="Web"$' export_presets.cfg
          godot --headless --path . --editor --quit --verbose

      - name: Export Web preview
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload Acode preview
        uses: actions/upload-artifact@v4
        with:
          name: BQ-Sqwad-Acode-Web-Preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14
